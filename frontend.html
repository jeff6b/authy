<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Keyframe</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0B0C0E;
            --ink: #fff;
            --mute: #8d929c;
            --line: #1d2026;
            --g: #AFFBB3;
            --on: #08150a;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh;
        }
        header {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: 20px 32px;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.25rem; letter-spacing: -.02em; }
        .brand img { width: 58px; height: 58px; object-fit: contain; mix-blend-mode: lighten; }
        .brand b { color: var(--g); font-weight: 800; }
        .tabs { display: flex; gap: 4px; padding: 5px; }
        .tab {
            background: none; border: 0; color: var(--mute);
            font: 500 0.65rem inherit;
            font-family: inherit; padding: 4px 10px; border-radius: 6px;
            cursor: pointer; transition: .15s; text-decoration: none;
            letter-spacing: 0.02em;
        }
        .tab:hover { color: #fff; }
        .dash {
            justify-self: end; background: var(--g); color: var(--on); font: 700 .9rem inherit;
            font-family: inherit; padding: 10px 20px; border: 0; border-radius: 8px;
            cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
            transition: .15s;
        }
        .dash:hover { transform: translateY(-1px); }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(24px,6vw,90px) 8vh; }
        .hero { display: grid; grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); gap: 48px; align-items: center; padding-left: clamp(0px,4vw,60px); }
        .shot { width: 100%; height: auto; display: block; border-radius: 14px; opacity: .13; }
        .acts { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
        .act {
            display: inline-flex; align-items: center; justify-content: center; height: 40px;
            padding: 0 20px; border-radius: 6px; font-family: inherit; font-size: .9rem;
            font-weight: 700; text-decoration: none; border: 1px solid transparent; transition: .15s;
        }
        .act.g { background: var(--g); color: var(--on); }
        .act.g:hover { transform: translateY(-2px); }
        .act.o { background: transparent; color: #fff; border-color: #2a2d33; }
        .act.o:hover { border-color: #fff; }
        h1 { margin: 0; font-size: clamp(3rem,6.4vw,5.6rem); line-height: 1; letter-spacing: -.05em; font-weight: 800; }
        h1 span { color: var(--g); margin-left: .07em; }
        .desc { margin: 18px 0 0; max-width: 460px; color: var(--mute); font-size: 1.05rem; line-height: 1.55; }
        @media(max-width:860px) {
            .hero { grid-template-columns: 1fr; padding-left: 0; }
            header { grid-template-columns: 1fr auto; padding: 16px 18px; gap: 12px; }
            .tabs { grid-row: 2; grid-column: 1/-1; justify-content: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="https://cdn.corenexis.com/f/I6Acgx8x.png" alt="">
        </div>
        <div class="tabs" role="tablist">
            <a class="tab" href="#">Home</a>
            <a class="tab" href="#">Docs</a>
            <a class="tab" href="#">Plans</a>
            <a class="tab" href="https://discord.gg/usekeyframe" target="_blank" rel="noopener">Discord</a>
        </div>
        <a class="dash" href="/api/auth/discord">Dashboard</a>
    </header>

    <main>
        <div class="hero">
            <div class="left">
                <h1>Key<span>frame</span></h1>
                <p class="desc">An auth that has both security and simplicity and you will enjoy it (hopefully)</p>
                <div class="acts">
                    <a class="act g" href="/api/auth/discord">Get started</a>
                    <a class="act o" href="#">Read docs</a>
                </div>
            </div>
            <img class="shot" src="https://cdn.corenexis.com/f/374vAnRE.png" alt="Keyframe dashboard" onerror="this.style.display='none'">
        </div>
    </main>
</body>
</html>
